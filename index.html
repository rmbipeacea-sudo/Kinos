<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="google" content="notranslate"><title>KINOS</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#F6F4EE;--cd:#fff;--tx:#15231D;--mu:#6B7A72;--pr:#0B6B4F;--p2:#E3F1EA;--ac:#F2B01E;--rd:#C8402F;--bd:#E4E0D5}
@media(prefers-color-scheme:dark){:root{--bg:#0E1512;--cd:#17221D;--tx:#EEF3F0;--mu:#93A59B;--pr:#2FB68A;--p2:#16342A;--bd:#27362F}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,sans-serif;padding-bottom:80px}
header{position:sticky;top:0;background:var(--pr);color:#fff;padding:12px 14px;font-weight:800;font-size:17px;z-index:5}
main{max-width:620px;margin:0 auto;padding:14px}.c{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:13px;margin-bottom:10px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}.g .c{margin:0}.k{font-size:12px;color:var(--mu)}.v{font-size:21px;font-weight:800}
.big{background:var(--pr);color:#fff;grid-column:1/3}.big .k{color:#ffffffb8}.big .v{font-size:30px}
.b{background:var(--pr);color:#fff;border:0;border-radius:12px;padding:12px;font-size:15px;font-weight:700;width:100%;margin-top:8px}
.b.s{width:auto;padding:7px 11px;margin:0;font-size:13px}.b.o{background:var(--p2);color:var(--pr)}.b.d{background:#C8402F18;color:var(--rd)}.b.y{background:var(--ac);color:#222}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--bd);border-radius:12px;background:var(--cd);color:var(--tx);font-size:15px;margin-bottom:8px}
.r{display:flex;gap:8px;align-items:center}.r>*{flex:1}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.t{padding:3px 9px;border-radius:99px;font-size:12px;font-weight:700;background:var(--p2);color:var(--pr)}.t.w{background:#F2B01E30;color:#9A6B00}.t.r{background:#C8402F18;color:var(--rd)}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--cd);border-top:1px solid var(--bd);display:flex;z-index:5;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:0;border:0;padding:8px 0;color:var(--mu);font-size:11px}nav i{display:block;font-size:20px;font-style:normal}nav .on{color:var(--pr);font-weight:800}
.mu{color:var(--mu);font-size:13px}.hero{text-align:center;padding:24px 10px}.hero h1{color:var(--pr);margin:4px}
#toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:#15231D;color:#fff;padding:10px 16px;border-radius:12px;z-index:20;display:none;max-width:90%}
</style></head><body><div id="app"></div><div id="toast"></div>
<script>
/* ====== CONFIG (clé publique : sans danger. JAMAIS la clé secrète / service_role) ====== */
const SB_URL='https://fnqinowrvvlrhwdmgppy.supabase.co', SB_KEY='sb_publishable_R_6wacUWzxdK_GX7YO7vFw_gicjEGXI';
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s),V=id=>$('#'+id).value,A=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast=t=>{const e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',3500)};
const R=async p=>{const{data,error}=await p;if(error){toast(error.message);throw error}return data};
const ST={new:'Nouvelle',confirmed:'Confirmée',preparing:'En préparation',delivering:'En livraison',delivered:'Livrée',cancelled:'Annulée'},NX=['new','confirmed','preparing','delivering','delivered'];
const COM=['Gombe','Limete','Kintambo','Ngaliema','Lemba','Matete','Bandalungwa','Kalamu','Lingwala','Masina',"N'djili",'Kasa-Vubu','Makala','Ngaba','Bumbu','Mont-Ngafula','Barumbu','Kinshasa'];
const opts=a=>a.map(x=>`<option>${esc(x)}</option>`).join('');
let S={shop:null,products:[],clients:[],orders:[],drivers:[],sales:[],stats:{}},view='home',C={},CUR='USD';
const m=n=>CUR=='USD'?'$'+(+n).toFixed(2).replace(/\.00$/,''):Math.round(n).toLocaleString('fr-FR')+' FC';
const P=new URLSearchParams(location.search);

/* ====== DÉMARRAGE ====== */
(async()=>{
 if(P.get('b'))return pubShop(P.get('b'));
 if(P.get('s'))return track(P.get('s'));
 const{data:{session}}=await sb.auth.getSession();
 session?boot():authView();
})();

/* ====== AUTH ====== */
function authView(){A.innerHTML=`<div class=hero><div style="font-size:42px">🛍️</div><h1>KINOS</h1><div class=mu>Vendre. Gérer. Livrer.</div></div><main><div class=c><input id=em type=email placeholder="Email"><input id=pw type=password placeholder="Mot de passe (6 caractères min.)">
<button class=b onclick=login()>Se connecter</button><button class="b o" onclick=signup()>Créer mon compte</button></div></main>`}
async function login(){await R(sb.auth.signInWithPassword({email:V('em'),password:V('pw')}));boot()}
async function signup(){const d=await R(sb.auth.signUp({email:V('em'),password:V('pw')}));d.session?boot():toast('Compte créé. Vérifie ton email puis connecte-toi.')}
async function logout(){await sb.auth.signOut();S.shop=null;authView()}

/* ====== BOUTIQUE ====== */
async function boot(){const sh=await R(sb.from('shops').select('*').maybeSingle());
 if(!sh)return shopForm();S.shop=sh;CUR=sh.currency;await load();render()}
function shopForm(){A.innerHTML=`<header>Créer ma boutique</header><main><div class=c><input id=sn placeholder="Nom de la boutique"><input id=ss placeholder="Adresse web (ex: rmbi-peace)"><input id=so placeholder="Ton prénom"><input id=sp type=tel placeholder="+243…"><select id=sc>${opts(COM)}</select>
<button class=b onclick=mkShop()>Créer</button></div><button class="b o" onclick=logout()>Se déconnecter</button></main>`}
async function mkShop(){await R(sb.rpc('create_shop',{p_name:V('sn'),p_slug:V('ss'),p_owner_name:V('so'),p_phone:V('sp'),p_commune:V('sc')}));boot()}
async function load(){const id=S.shop.id,d0=new Date();d0.setHours(0,0,0,0);const d1=new Date(d0);d1.setDate(d1.getDate()+1);
 const[pr,cl,or,dr,sa,st]=await Promise.all([
  R(sb.from('products').select('*').eq('is_active',true).order('name')),R(sb.from('clients').select('*').order('name')),
  R(sb.from('orders').select('*,order_items(*)').order('created_at',{ascending:false}).limit(50)),R(sb.from('drivers').select('*').eq('is_active',true)),
  R(sb.from('sales').select('*,clients(name)').order('created_at',{ascending:false}).limit(30)),
  R(sb.rpc('dashboard_stats',{p_shop:id,p_from:d0.toISOString(),p_to:d1.toISOString()}))]);
 Object.assign(S,{products:pr,clients:cl,orders:or,drivers:dr,sales:sa,stats:st})}
const TABS=[['home','🏠','Accueil'],['prod','📦','Produits'],['caisse','💰','Caisse'],['cli','👥','Clients'],['ord','🧾','Commandes'],['more','☰','Menu']];
function render(){A.innerHTML=`<header>${esc(S.shop.name)}</header><main>${VIEWS[view]()}</main><nav>${TABS.map(t=>`<button class="${view==t[0]?'on':''}" onclick="go('${t[0]}')"><i>${t[1]}</i>${t[2]}</button>`).join('')}</nav>`}
const go=async v=>{view=v;await load();render();scrollTo(0,0)};
const modalCls='';

/* ====== ACCUEIL ====== */
function home(){const s=S.stats;return `<div class=g><div class="c big"><div class=k>Bénéfice net du jour</div><div class=v>${m(s.net_profit||0)}</div></div>
<div class=c><div class=k>Chiffre d'affaires</div><div class=v>${m(s.revenue||0)}</div></div><div class=c><div class=k>Dépenses</div><div class=v>${m(s.expenses||0)}</div></div>
<div class=c><div class=k>Commandes en cours</div><div class=v>${s.open_orders||0}</div></div><div class=c><div class=k>Impayés</div><div class=v style="color:var(--rd)">${m(s.receivables||0)}</div></div></div>
${s.low_stock?`<div class=c>⚠️ <b>${s.low_stock}</b> produit(s) en stock faible</div>`:''}
<h3>Ventes récentes</h3>${S.sales.slice(0,8).map(x=>`<div class="c row"><div><b>${esc(x.invoice_no)}</b><div class=mu>${esc(x.clients?.name||'Client de passage')} · ${esc(x.pay)}</div></div><div style="text-align:right"><b>${m(x.total)}</b><div><span class="t ${x.status=='paid'?'':'w'}">${x.status=='paid'?'Payé':'Reste '+m(x.total-x.paid)}</span></div></div></div>`).join('')||'<div class=mu>Aucune vente.</div>'}`}

/* ====== PRODUITS ====== */
function prod(){return `<h2>Produits</h2><button class=b onclick="pForm()">➕ Ajouter un produit</button><div style="height:10px"></div>${S.products.map(p=>`<div class=c><div class=row><div><b>${esc(p.emoji||'📦')} ${esc(p.name)}</b><div class=mu>Vente ${m(p.price)} · achat ${m(p.cost)}</div></div><div style="text-align:right"><span class="t ${p.stock<=p.low_stock_threshold?'r':''}">Stock ${p.stock}</span><div style="margin-top:6px"><button class="b o s" onclick="stk('${p.id}',${p.stock-1})">−</button> <button class="b o s" onclick="stk('${p.id}',${p.stock+1})">+</button></div></div></div>
<div class=r style="margin-top:8px"><button class="b o s" onclick="pForm('${p.id}')">✏️ Modifier</button><button class="b d s" onclick="pDel('${p.id}')">🗑 Supprimer</button></div></div>`).join('')||'<div class=mu>Aucun produit.</div>'}`}
function pForm(id){const p=S.products.find(x=>x.id==id)||{};A.innerHTML=`<header>${id?'Modifier':'Nouveau'} produit</header><main><div class=c><input id=pn placeholder="Nom" value="${esc(p.name)}"><div class=r><input id=pp type=number step=any placeholder="Prix vente" value="${p.price??''}"><input id=pc type=number step=any placeholder="Prix achat" value="${p.cost??''}"></div>
<div class=r><input id=ps type=number placeholder="Stock" value="${p.stock??''}"><input id=pe placeholder="Emoji" maxlength=2 value="${esc(p.emoji)}"></div><input id=pt placeholder="Catégorie" value="${esc(p.category)}"><button class=b onclick="pSave('${id||''}')">Enregistrer</button><button class="b o" onclick="go('prod')">Annuler</button></div></main>`}
async function pSave(id){const d={name:V('pn').trim(),price:+V('pp'),cost:+V('pc')||0,stock:+V('ps')||0,emoji:V('pe')||null,category:V('pt')||null};
 id?await R(sb.from('products').update(d).eq('id',id)):await R(sb.from('products').insert({...d,shop_id:S.shop.id}));go('prod')}
async function stk(id,n){if(n<0)return;await R(sb.from('products').update({stock:n}).eq('id',id));go('prod')}
async function pDel(id){if(confirm('Supprimer ce produit ?')){await R(sb.from('products').update({is_active:false}).eq('id',id));go('prod')}}

/* ====== CAISSE MULTI-PRODUITS ====== */
function caisse(){const L=Object.entries(C).filter(e=>e[1]>0),tot=L.reduce((a,[id,q])=>a+q*S.products.find(p=>p.id==id).price,0);
 return `<h2>Caisse</h2>${S.products.map(p=>`<div class="c row"><div><b>${esc(p.emoji||'')} ${esc(p.name)}</b><div class=mu>${m(p.price)} · stock ${p.stock}</div></div><div class=r style="flex:0 0 120px"><button class="b o s" onclick="cq('${p.id}',-1)">−</button><b style="text-align:center">${C[p.id]||0}</b><button class="b s" onclick="cq('${p.id}',1)">+</button></div></div>`).join('')}
${L.length?`<div class=c><h3>Total : ${m(tot)}</h3><select id=kc><option value="">Client de passage</option>${S.clients.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select>
<select id=ky>${opts(['Cash','M-Pesa','Airtel Money','Orange Money'])}</select><input id=kd type=number step=any placeholder="Remise (optionnel)"><input id=kp type=number step=any placeholder="Montant payé (vide = payé en totalité)"><button class=b onclick=sell()>✅ Valider la vente</button></div>`:''}`}
const cq=(id,d)=>{C[id]=Math.max(0,(C[id]||0)+d);render()};
async function sell(){const items=Object.entries(C).filter(e=>e[1]>0).map(([product_id,qty])=>({product_id,qty}));
 await R(sb.rpc('create_sale',{p_shop:S.shop.id,p_client:V('kc')||null,p_items:items,p_discount:+V('kd')||0,p_paid:V('kp')===''?null:+V('kp'),p_pay:V('ky')}));
 C={};toast('Vente enregistrée ✓');go('home')}

/* ====== CLIENTS ====== */
function cli(){return `<h2>Clients</h2><div class=c><input id=cn placeholder="Nom"><input id=cp type=tel placeholder="+243…"><button class=b onclick=cAdd()>➕ Ajouter</button></div>${S.clients.map(c=>`<div class="c row"><div><b>${esc(c.name)}</b><div class=mu>${esc(c.phone||'')}</div></div>${c.phone?`<a href="https://wa.me/${c.phone.replace(/\D/g,'')}" target=_blank><button class="b y s">WhatsApp</button></a>`:''}</div>`).join('')}`}
async function cAdd(){await R(sb.from('clients').insert({shop_id:S.shop.id,name:V('cn').trim(),phone:V('cp')||null}));go('cli')}

/* ====== COMMANDES & LIVREURS ====== */
function ord(){return `<h2>Commandes</h2>${S.orders.map(o=>{const i=NX.indexOf(o.status);return `<div class=c><div class=row><b>${esc(o.customer_name)}</b><span class="t ${o.status=='delivered'?'':'w'}">${ST[o.status]}</span></div>
<div class=mu>📍 ${esc(o.commune)} · ${esc(o.customer_phone)} · #${esc(o.tracking_code)}</div><div>${o.order_items.map(x=>x.qty+'× '+esc(x.product_name)).join(', ')}</div><b>${m(o.total)}</b>
${i>=0&&i<4?`<div class=r style="margin-top:8px"><select onchange="oSet('${o.id}',{driver_id:this.value||null})"><option value="">🛵 Livreur…</option>${S.drivers.map(d=>`<option value="${d.id}" ${d.id==o.driver_id?'selected':''}>${esc(d.name)}</option>`).join('')}</select><input type=number step=any placeholder="Frais" value="${o.delivery_fee||''}" onchange="oSet('${o.id}',{delivery_fee:+this.value||0})"></div>
<div class=r><button class=b onclick="oNext('${o.id}','${NX[i+1]}')">→ ${ST[NX[i+1]]}</button><button class="b d" onclick="oNext('${o.id}','cancelled')">Annuler</button></div>`:''}</div>`}).join('')||'<div class=mu>Aucune commande.</div>'}`}
async function oNext(id,s){await R(sb.rpc('update_order_status',{p_order:id,p_status:s}));go('ord')}
async function oSet(id,d){await R(sb.from('orders').update(d).eq('id',id));await load()}

/* ====== MENU ====== */
function more(){const url=location.origin+location.pathname+'?b='+S.shop.slug;
 return `<h2>Menu</h2><div class=c><div class=k>Lien de ta boutique (à partager)</div><b style="word-break:break-all">${esc(url)}</b><a href="https://wa.me/?text=${encodeURIComponent('🛍️ '+S.shop.name+' — commande en ligne : '+url)}" target=_blank><button class="b y">📲 Partager sur WhatsApp</button></a></div>
<div class=c><h3>Dépense</h3><input id=el placeholder="Ex : Transport"><input id=ea type=number step=any placeholder="Montant"><button class="b o" onclick=addExp()>Enregistrer</button></div>
<div class=c><h3>Livreurs</h3>${S.drivers.map(d=>`<div class=row><span>🛵 ${esc(d.name)}</span><span class=mu>${esc(d.phone||'')}</span></div>`).join('')}<input id=dn placeholder="Nom du livreur" style="margin-top:8px"><input id=dp type=tel placeholder="Téléphone"><button class="b o" onclick=addDr()>➕ Ajouter</button></div>
<div class=c><div class=k>Mobile Money (M-Pesa, Airtel, Orange)</div>Enregistrement manuel seulement : aucune intégration réelle.</div>
${S.products.length?'':'<button class="b o" onclick=demo()>🎁 Charger des produits de démo</button>'}<button class="b d" onclick=logout()>Se déconnecter</button>`}
async function addExp(){await R(sb.from('expenses').insert({shop_id:S.shop.id,label:V('el'),amount:+V('ea')}));toast('Dépense enregistrée');go('home')}
async function addDr(){await R(sb.from('drivers').insert({shop_id:S.shop.id,name:V('dn'),phone:V('dp')||null}));go('more')}
async function demo(){await R(sb.rpc('seed_demo',{p_shop:S.shop.id}));go('prod')}
const VIEWS={home,prod,caisse,cli,ord,more};

/* ====== BOUTIQUE PUBLIQUE (sans compte) ====== */
let PS=null,PC={};
async function pubShop(slug){const d=await R(sb.rpc('public_shop',{p_slug:slug}));
 if(!d){A.innerHTML='<main><div class=c>Boutique introuvable.</div></main>';return}PS=d;CUR=d.shop.currency;pubRender()}
function pubRender(){const sh=PS.shop,L=Object.entries(PC).filter(e=>e[1]>0),tot=L.reduce((a,[id,q])=>a+q*PS.products.find(p=>p.id==id).price,0);
 A.innerHTML=`<header>${esc(sh.name)}</header><main><div class=hero style="padding:10px"><div class=mu>📍 ${esc(sh.commune||'Kinshasa')}</div></div>
 ${PS.products.map(p=>`<div class="c row"><div><b>${esc(p.emoji||'📦')} ${esc(p.name)}</b><div style="color:var(--pr);font-weight:800">${m(p.price)}</div>${p.in_stock?'':'<span class="t r">Rupture</span>'}</div>${p.in_stock?`<div class=r style="flex:0 0 120px"><button class="b o s" onclick="pq('${p.id}',-1)">−</button><b style="text-align:center">${PC[p.id]||0}</b><button class="b s" onclick="pq('${p.id}',1)">+</button></div>`:''}</div>`).join('')}
 ${L.length?`<div class=c><h3>Ma commande · ${m(tot)}</h3><input id=on placeholder="Mon nom"><input id=op type=tel placeholder="Mon téléphone (+243…)"><select id=oc>${opts(PS.zones.map(z=>z.commune))}</select><input id=oa placeholder="Adresse / repère (optionnel)"><div class=mu>Les frais de livraison s'ajoutent selon la commune. Paiement à la livraison.</div><button class=b onclick=placeOrder()>Commander</button></div>`:''}</main>`}
const pq=(id,d)=>{PC[id]=Math.max(0,(PC[id]||0)+d);pubRender()};
async function placeOrder(){const items=Object.entries(PC).filter(e=>e[1]>0).map(([product_id,qty])=>({product_id,qty}));
 const code=await R(sb.rpc('place_public_order',{p_slug:PS.shop.slug,p_name:V('on'),p_phone:V('op'),p_commune:V('oc'),p_address:V('oa'),p_items:items}));
 A.innerHTML=`<header>${esc(PS.shop.name)}</header><main><div class=hero><div style="font-size:42px">✅</div><h2>Commande envoyée !</h2><div>Code de suivi : <b>${esc(code)}</b></div><a href="?s=${encodeURIComponent(code)}"><button class=b>Suivre ma commande</button></a></div></main>`}
async function track(code){const d=await R(sb.rpc('get_order_status',{p_code:code}));
 A.innerHTML=`<header>Suivi de commande</header><main>${d?`<div class=c><b>${esc(d.shop)}</b><div style="margin:8px 0"><span class=t>${ST[d.status]}</span></div>${(d.items||[]).map(i=>`<div>${i.qty}× ${esc(i.name)}</div>`).join('')}<b>Total : ${d.total}</b></div>`:'<div class=c>Code introuvable.</div>'}</main>`}
</script></body></html>
